name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain and simulator inventory
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          swift --version | tee "$RUNNER_TEMP/swift-version.txt"
          xcrun simctl list devices available | tee "$RUNNER_TEMP/simulators.txt"
      - name: Swift package tests
        run: |
          set -euo pipefail
          swift package resolve
          swift test
      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          candidates = []
          for runtime, devices in data['devices'].items():
              if not runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS-'):
                  continue
              for device in devices:
                  match = re.search(r'iPhone (\d+)', device['name'])
                  if device.get('isAvailable') and match and int(match.group(1)) >= 11:
                      candidates.append((runtime, device['name'], device['udid']))
          if not candidates:
              raise SystemExit('Nenhum iPhone 11 ou posterior disponível no runner')
          runtime, name, udid = sorted(candidates)[-1]
          with open(sys.argv[2], 'a', encoding='utf-8') as out:
              out.write(f'udid={udid}\nname={name}\nruntime={runtime}\n')
          print(f'Selecionado: {name} ({runtime}, {udid})')
          PY
      - name: Xcode tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project YumiCrushSaga.xcodeproj \
            -scheme YumiCrushSaga \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/YumiDerived" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcode-test.log"
      - name: Build, install, launch and capture simulator
        run: |
          set -euo pipefail
          DEVICE="${{ steps.simulator.outputs.udid }}"
          APP="$RUNNER_TEMP/YumiDerived/Build/Products/Debug-iphonesimulator/YumiCrushSaga.app"
          mkdir -p "$RUNNER_TEMP/yumi-evidence"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild build \
            -project YumiCrushSaga.xcodeproj \
            -scheme YumiCrushSaga \
            -destination "id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/YumiDerived" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcode-build.log"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" br.com.nicolasugai.yumicrushsaga | tee "$RUNNER_TEMP/yumi-evidence/launch.log"
          sleep 5
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/yumi-evidence/home.png"
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact > "$RUNNER_TEMP/yumi-evidence/simulator.log" || true
          cp "$RUNNER_TEMP/xcode-version.txt" "$RUNNER_TEMP/yumi-evidence/"
          cp "$RUNNER_TEMP/swift-version.txt" "$RUNNER_TEMP/yumi-evidence/"
          printf 'device=%s\nruntime=%s\n' "${{ steps.simulator.outputs.name }}" "${{ steps.simulator.outputs.runtime }}" > "$RUNNER_TEMP/yumi-evidence/device.txt"
      - name: Preserve simulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-evidence
          path: |
            ${{ runner.temp }}/yumi-evidence
            ${{ runner.temp }}/xcode-test.log
            ${{ runner.temp }}/xcode-build.log
            ${{ runner.temp }}/simulators.txt
          if-no-files-found: ignore
          retention-days: 7
